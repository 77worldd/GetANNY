appId: com.getanny.app
productName: GetANNY
copyright: Copyright © 2026 GetANNY contributors
directories:
  output: dist
  buildResources: assets
files:
  - src/main/**/*
  - "!src/main/**/*.test.js"
  - package.json
  - dist-renderer/**/*
  - assets/icon.png
  - assets/tray-icon.png
  - LICENSE
  - docs/THIRD_PARTY.md
extraResources:
  # Native CLI entrypoint must be a real file, not an ASAR virtual path.
  - from: src/main/browser-integration/native-host.js
    to: native-host/native-host.js
  - from: node_modules/ws/
    to: native-host/node_modules/ws/
    filter: ["package.json", "index.js", "lib/**/*.js"]
  - from: bin/
    to: bin/
    filter:
      [
        "yt-dlp.exe",
        "yt-dlp",
        "yt-dlp_macos",
        "ffmpeg*",
        "ffprobe*",
        "GetANNY.NativeHost.exe",
        "FFmpeg-*.txt",
      ]
  - from: dist-extension/
    to: extension/
    filter: ["**/*"]
win:
  target:
    - target: nsis
      arch: [x64]
    - target: msi
      arch: [x64]
  icon: assets/icon.ico
  executableName: GetANNY
  requestedExecutionLevel: asInvoker
nsis:
  artifactName: "GetANNY Setup.${ext}"
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  include: scripts/windows/installer.nsh
msi:
  artifactName: "GetANNY Setup.${ext}"
  oneClick: false
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: false
  warningsAsErrors: true
msiProjectCreated: scripts/windows/customize-msi.js
beforePack: scripts/verify-package.js
afterPack: scripts/verify-installed-resources.js
linux:
  target: [{ target: AppImage, arch: [x64] }]
  icon: assets/icon.png
  category: Network
mac:
  target: [{ target: dmg, arch: [x64, arm64] }]
  icon: assets/icon.icns
  category: public.app-category.utilities
asar: true
npmRebuild: false
asarUnpack:
  - "node_modules/better-sqlite3/**/*"
  - "node_modules/node-datachannel/**/*"
  - "src/main/engine/**/*"
publish: null
