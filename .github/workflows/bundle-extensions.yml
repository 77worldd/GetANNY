name: Bundle published browser extensions
on:
  push:
    branches: [arena/456bcab4-getanny]
    paths: [.github/workflows/bundle-extensions.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    name: Combine the eight published extension ZIPs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download the official extension packages
        run: gh release download v2.0.0-rc.2 --repo 77worldd/GetANNY --pattern 'GetANNY-*-2.0.0-rc.2.zip' --dir packages
      - name: Build and validate the combined archive
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import hashlib, json
          browsers = ['helium', 'chrome', 'chromium', 'brave', 'firefox', 'vivaldi', 'opera', 'edge']
          output = Path('combined/GetANNY-extensions-2.0.0-rc.2')
          output.mkdir(parents=True)
          for browser in browsers:
              package = Path('packages') / f'GetANNY-{browser}-2.0.0-rc.2.zip'
              target = output / browser
              target.mkdir()
              with ZipFile(package) as archive:
                  for info in archive.infolist():
                      name = Path(info.filename)
                      assert not name.is_absolute() and '..' not in name.parts
                  archive.extractall(target)
              manifest = json.loads((target / 'manifest.json').read_text())
              assert manifest['version'] == '2.0.0.2'
              assert f'GETANNY_BROWSER = "{browser}"' in (target / 'config.js').read_text()
              assert (target / 'download-interceptor.js').is_file()
          (output / 'README.txt').write_text(
              'GetANNY 2.0.0-rc.2 - all browser extensions (version 2.0.0.2)\n\n'
              'Extract this archive and select the folder for your browser. Each folder contains '
              'the ready-to-load unpacked extension and its INSTALL.md guide. Browser consent is required. '
              'Firefox permanent installation requires Mozilla signing.\n\n'
              'Guide: https://github.com/77worldd/GetANNY/blob/arena/456bcab4-getanny/docs/BROWSERS.md\n'
          )
          checksums = []
          for file in sorted(output.rglob('*')):
              if file.is_file():
                  digest = hashlib.sha256(file.read_bytes()).hexdigest()
                  checksums.append(f'{digest}  {file.relative_to(output).as_posix()}')
          (output / 'SHA256SUMS.txt').write_text('\n'.join(checksums) + '\n')
          archive_name = Path('GetANNY-all-extensions-2.0.0-rc.2.zip')
          with ZipFile(archive_name, 'w', ZIP_DEFLATED, compresslevel=9) as archive:
              for file in sorted(output.rglob('*')):
                  if file.is_file():
                      archive.write(file, file.relative_to(output.parent))
          with ZipFile(archive_name) as archive:
              assert archive.testzip() is None
              for browser in browsers:
                  assert f'{output.name}/{browser}/manifest.json' in archive.namelist()
          print('Combined archive SHA-256:', hashlib.sha256(archive_name.read_bytes()).hexdigest())
          PY
      - name: Attach the aggregate and verify its published digest
        run: |
          gh release upload v2.0.0-rc.2 --repo 77worldd/GetANNY 'GetANNY-all-extensions-2.0.0-rc.2.zip#GetANNY-all-extensions-2.0.0-rc.2.zip' --clobber
          expected="sha256:$(sha256sum GetANNY-all-extensions-2.0.0-rc.2.zip | cut -d' ' -f1)"
          actual=$(gh api repos/77worldd/GetANNY/releases/tags/v2.0.0-rc.2 --jq '.assets[] | select(.label == "GetANNY-all-extensions-2.0.0-rc.2.zip") | .digest')
          test "$actual" = "$expected"
          echo "Combined extensions: https://github.com/77worldd/GetANNY/releases/download/v2.0.0-rc.2/GetANNY-all-extensions-2.0.0-rc.2.zip"
