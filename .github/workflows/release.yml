name: Windows installers and integration tests
on:
  push:
    branches: [arena/9c64a2a0-getanny]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a prerelease ONLY after all automated gates pass
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: getanny-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Build, install, exercise and uninstall EXE + MSI
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5
      - name: Validate Windows PowerShell harness syntax
        shell: pwsh
        run: |
          Get-ChildItem scripts/windows -Filter '*.ps1' | ForEach-Object {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Restore locked N-API native payloads
        id: node-natives
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules/better-sqlite3/prebuilds/win32-x64.node
            node_modules/node-datachannel/build/Release/*
          key: napi-windows-x64-native-${{ hashFiles('package-lock.json') }}
      - name: Prepare native dependency when not cached
        if: steps.node-natives.outputs.cache-hit != 'true'
        run: |
          npm rebuild node-datachannel
      - name: Cache verified N-API payloads
        if: steps.node-natives.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            node_modules/better-sqlite3/prebuilds/win32-x64.node
            node_modules/node-datachannel/build/Release/*
          key: napi-windows-x64-native-${{ hashFiles('package-lock.json') }}
      - name: Fetch pinned, checksum-verified tools and compile Windows native host
        run: npm run prepare:tools
      - name: Build all browser packages
        run: npm run build-extension
      - name: Exercise actual compiled C# launcher before packaging
        shell: pwsh
        run: |
          New-Item test-results/windows -ItemType Directory -Force | Out-Null
          $env:GETANNY_NATIVE_LAUNCHER='1'
          node --test --test-concurrency=1 tests/browser.test.js 2>&1 | Tee-Object test-results/windows/native-launcher.log
          exit $LASTEXITCODE
      - name: Real backend, media and bridge tests
        shell: pwsh
        run: |
          New-Item test-results/windows -ItemType Directory -Force | Out-Null
          node --test --test-concurrency=1 --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=test-results/windows/backend-junit.xml tests/*.test.js src/main/**/*.test.js 2>&1 | Tee-Object test-results/windows/backend-tests.log
          exit $LASTEXITCODE
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Build renderer
        run: npm run build:renderer
      - name: Install actual Chromium for extension E2E
        run: npx playwright install chromium
      - name: Build branded EXE and MSI installers
        shell: pwsh
        run: |
          npx electron-builder --win nsis msi --publish never 2>&1 | Tee-Object test-results/windows/build.log
          exit $LASTEXITCODE
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Install, launch, download, integrate, restart, reinstall and uninstall both packages
        shell: pwsh
        run: |
          ./scripts/windows/test-installers.ps1 *>&1 | Tee-Object test-results/windows/installed-tests.log
      - name: Report actual failures through check annotations
        if: failure()
        shell: pwsh
        run: |
          # Check annotations stay readable through GitHub's API even when a
          # development sandbox cannot reach the external Actions log host.
          function Annotate([string] $title, [string] $text, [string] $level='error') {
            $text = [regex]::Replace($text,'[ \t]+',' ')
            if ($text.Length -gt 3800) { $text = $text.Substring($text.Length - 3800) }
            $text = $text.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::$level title=$title::$text"
          }
          if (Test-Path test-results/windows/backend-junit.xml) {
            [xml]$junit = Get-Content test-results/windows/backend-junit.xml -Raw
            $junit.SelectNodes('//failure') | ForEach-Object { Annotate 'Backend test failure' $_.InnerText }
          }
          Get-ChildItem test-results/windows -Recurse -File -Filter '*.json' -ErrorAction SilentlyContinue | ForEach-Object {
            $report = Get-Content $_.FullName -Raw | ConvertFrom-Json
            if ($report.checks) { $report.checks | Where-Object passed -eq $false | ForEach-Object { Annotate $_.name $_.error } }
            elseif ($report.passed -eq $false) { Annotate $_.Name ($report | ConvertTo-Json -Depth 12) }
          }
          Get-ChildItem test-results/windows -File -Filter '*.log' -ErrorAction SilentlyContinue | Where-Object { $_.Name -ne 'backend-tests.log' -and ($_.Name -ne 'native-launcher.log' -or (Select-String -Path $_.FullName -Pattern 'not ok|ERR!|Error:' -Quiet)) } | ForEach-Object { Annotate "Diagnostic log $($_.Name)" ((Get-Content $_.FullName -Tail 35) -join "`n") 'notice' }
      - name: Summarize measured evidence without publishing user secrets
        if: always()
        run: node scripts/report-windows-evidence.js
      - name: Retain executable test reports and installation logs even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-evidence
          path: test-results/windows/
          if-no-files-found: warn
          retention-days: 30
      - name: Assemble release assets and checksums
        shell: pwsh
        run: |
          ./scripts/windows/assemble-release.ps1
      - name: Retain tested distributables
        uses: actions/upload-artifact@v7
        with:
          name: GetANNY-tested-windows-release
          path: release-assets/
          retention-days: 30
      - name: Publish explicitly requested release candidate (not a claim of manual certification)
        # A trusted push can explicitly opt in when the repository integration
        # lacks Actions dispatch permission. Neither route skips a single gate.
        if: (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && contains(github.event.head_commit.message, 'GetANNY-Publish: prerelease'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists. Never silently replace an existing release." }
          $assets = Get-ChildItem release-assets -File | ForEach-Object { $_.FullName }
          $notesFile = Join-Path $env:RUNNER_TEMP 'GetANNY-release-notes.md'
          @(
            (Get-Content docs/RELEASE_NOTES.md -Raw),
            '',
            (Get-Content release-assets/MEASURED_RESULTS.md -Raw),
            '',
            '## Build and verification',
            'Source commit: `${{ github.sha }}`.',
            'Windows verification: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}',
            '',
            '## SHA-256',
            '```text',
            (Get-Content release-assets/SHA256SUMS.txt -Raw),
            '```'
          ) -join "`n" | Set-Content $notesFile
          gh release create $tag @assets --target '${{ github.sha }}' --prerelease --title "GetANNY $version · Windows release candidate" --notes-file $notesFile
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
