name: Windows installers and integration tests
on:
  push:
    branches: [arena/9c64a2a0-getanny]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a prerelease ONLY after all automated gates pass
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: getanny-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Build, install, exercise and uninstall EXE + MSI
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies (no early Electron ABI rebuild)
        run: npm ci --ignore-scripts
      - name: Native dependencies for Node test runner
        run: |
          npm rebuild better-sqlite3
          npm rebuild node-datachannel
      - name: Fetch pinned, checksum-verified tools and compile Windows native host
        run: npm run prepare:tools
      - name: Build all browser packages
        run: npm run build-extension
      - name: Real backend, media and bridge tests
        shell: pwsh
        run: |
          New-Item test-results/windows -ItemType Directory -Force | Out-Null
          npm test 2>&1 | Tee-Object test-results/windows/backend-tests.log
          exit $LASTEXITCODE
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Build renderer
        run: npm run build:renderer
      - name: Install actual Chromium for extension E2E
        run: npx playwright install chromium
      - name: Rebuild SQLite for the packaged Electron ABI
        run: npx electron-rebuild --force --only better-sqlite3
      - name: Build branded EXE and MSI installers
        shell: pwsh
        run: |
          npx electron-builder --win nsis msi --publish never 2>&1 | Tee-Object test-results/windows/build.log
          exit $LASTEXITCODE
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Install, launch, download, integrate, restart, reinstall and uninstall both packages
        shell: pwsh
        run: |
          ./scripts/windows/test-installers.ps1 *>&1 | Tee-Object test-results/windows/installed-tests.log
      - name: Report actual failures through check annotations
        if: failure()
        shell: pwsh
        run: |
          # Check annotations stay readable through GitHub's API even when a
          # development sandbox cannot reach the external Actions log host.
          Get-ChildItem test-results/windows -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in @('.json','.log') } | ForEach-Object {
            $text = (Get-Content $_.FullName -Tail 140) -join "`n"
            $text = $text.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=$($_.Name)::$text"
          }
      - name: Retain executable test reports and installation logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-evidence
          path: test-results/windows/
          if-no-files-found: warn
          retention-days: 30
      - name: Assemble release assets and checksums
        shell: pwsh
        run: |
          Copy-Item 'dist/GetANNY Setup.exe' 'release-assets/GetANNY Setup.exe'
          Copy-Item 'dist/GetANNY Setup.msi' 'release-assets/GetANNY Setup.msi'
          Copy-Item 'docs/INSTALL_WINDOWS.md' 'release-assets/INSTALL_WINDOWS.md'
          Copy-Item 'docs/BROWSERS.md' 'release-assets/BROWSERS.md'
          Copy-Item 'docs/RELEASE_NOTES.md' 'release-assets/RELEASE_NOTES.md'
          Compress-Archive -Path test-results/windows/* -DestinationPath release-assets/Windows-test-evidence.zip
          node scripts/checksums.js
      - name: Retain tested distributables
        uses: actions/upload-artifact@v4
        with:
          name: GetANNY-tested-windows-release
          path: release-assets/
          retention-days: 30
      - name: Publish explicitly requested release candidate (not a claim of manual certification)
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists. Never silently replace an existing release." }
          $assets = Get-ChildItem release-assets -File | ForEach-Object { $_.FullName }
          gh release create $tag @assets --target '${{ github.sha }}' --prerelease --title "GetANNY $version · Windows release candidate" --notes-file docs/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
