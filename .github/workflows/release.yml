name: Windows release

on:
  push:
    branches:
      - main
      - arena/3f45208e-getanny
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    name: Build and publish Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          npm install 2>&1 | Tee-Object -FilePath npm-install.log
          $installExit = $LASTEXITCODE
          if ($installExit -ne 0) {
            $details = (Get-Content npm-install.log -Tail 25) -join ' | '
            Write-Error "npm install failed with exit code $installExit. $details"
            exit 1
          }

      - name: Download yt-dlp
        run: node scripts/download-ytdlp.js

      - name: Build browser extensions
        run: node scripts/build-extension.js

      - name: Build Windows NSIS installer
        run: npx electron-builder --win nsis

      - name: Select release tag
        id: release
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $tag = '${{ github.ref_name }}'
          } else {
            $version = node -p "require('./package.json').version"
            if ('${{ github.ref_name }}' -eq 'main') {
              $tag = "v$version-main.${{ github.run_number }}"
            } else {
              $tag = "v$version"
            }
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag"

      - name: Publish installer release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: GetANNY ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: dist/*.exe
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
