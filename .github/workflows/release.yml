name: Windows installers and integration tests
on:
  push:
    branches: [arena/9c64a2a0-getanny]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a prerelease ONLY after all automated gates pass
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: getanny-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Build, install, exercise and uninstall EXE + MSI
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5
      - name: Validate Windows PowerShell harness syntax
        shell: pwsh
        run: |
          Get-ChildItem scripts/windows -Filter '*.ps1' | ForEach-Object {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Restore locked N-API native payloads
        id: node-natives
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules/better-sqlite3/prebuilds/win32-x64.node
            node_modules/node-datachannel/build/Release/*
          key: napi-windows-x64-native-${{ hashFiles('package-lock.json') }}
      - name: Prepare native dependency when not cached
        if: steps.node-natives.outputs.cache-hit != 'true'
        run: |
          npm rebuild node-datachannel
      - name: Cache verified N-API payloads
        if: steps.node-natives.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            node_modules/better-sqlite3/prebuilds/win32-x64.node
            node_modules/node-datachannel/build/Release/*
          key: napi-windows-x64-native-${{ hashFiles('package-lock.json') }}
      - name: Fetch pinned, checksum-verified tools and compile Windows native host
        run: npm run prepare:tools
      - name: Build all browser packages
        run: npm run build-extension
      - name: Exercise actual compiled C# launcher before packaging
        shell: pwsh
        run: |
          New-Item test-results/windows -ItemType Directory -Force | Out-Null
          $env:GETANNY_NATIVE_LAUNCHER='1'
          node --test --test-concurrency=1 tests/browser.test.js 2>&1 | Tee-Object test-results/windows/native-launcher.log
          exit $LASTEXITCODE
      - name: Real backend, media and bridge tests
        shell: pwsh
        run: |
          New-Item test-results/windows -ItemType Directory -Force | Out-Null
          node --test --test-concurrency=1 --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=test-results/windows/backend-junit.xml tests/*.test.js src/main/**/*.test.js 2>&1 | Tee-Object test-results/windows/backend-tests.log
          exit $LASTEXITCODE
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Build renderer
        run: npm run build:renderer
      - name: Install actual Chromium for extension E2E
        run: npx playwright install chromium
      - name: Build branded EXE and MSI installers
        shell: pwsh
        run: |
          npx electron-builder --win nsis msi --publish never 2>&1 | Tee-Object test-results/windows/build.log
          exit $LASTEXITCODE
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Install, launch, download, integrate, restart, reinstall and uninstall both packages
        shell: pwsh
        run: |
          ./scripts/windows/test-installers.ps1 *>&1 | Tee-Object test-results/windows/installed-tests.log
      - name: Report actual failures through check annotations
        if: failure()
        shell: pwsh
        run: |
          # Check annotations stay readable through GitHub's API even when a
          # development sandbox cannot reach the external Actions log host.
          function Annotate([string] $title, [string] $text, [string] $level='error') {
            $text = [regex]::Replace($text,'[ \t]+',' ')
            if ($text.Length -gt 3800) { $text = $text.Substring($text.Length - 3800) }
            $text = $text.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::$level title=$title::$text"
          }
          if (Test-Path test-results/windows/backend-junit.xml) {
            [xml]$junit = Get-Content test-results/windows/backend-junit.xml -Raw
            $junit.SelectNodes('//failure') | ForEach-Object { Annotate 'Backend test failure' $_.InnerText }
          }
          Get-ChildItem test-results/windows -Recurse -File -Filter '*.json' -ErrorAction SilentlyContinue | ForEach-Object {
            $report = Get-Content $_.FullName -Raw | ConvertFrom-Json
            if ($report.checks) { $report.checks | Where-Object passed -eq $false | ForEach-Object { Annotate $_.name $_.error } }
            elseif ($report.passed -eq $false) { Annotate $_.Name ($report | ConvertTo-Json -Depth 12) }
          }
          Get-ChildItem test-results/windows -File -Filter '*.log' -ErrorAction SilentlyContinue | Where-Object { $_.Name -ne 'backend-tests.log' -and ($_.Name -ne 'native-launcher.log' -or (Select-String -Path $_.FullName -Pattern 'not ok|ERR!|Error:' -Quiet)) } | ForEach-Object { Annotate "Diagnostic log $($_.Name)" ((Get-Content $_.FullName -Tail 35) -join "`n") 'notice' }
      - name: Summarize measured evidence without publishing user secrets
        if: always()
        run: node scripts/report-windows-evidence.js
      - name: Retain executable test reports and installation logs even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-evidence
          path: test-results/windows/
          if-no-files-found: warn
          retention-days: 30
      - name: Assemble release assets and checksums
        shell: pwsh
        run: |
          $evidenceRoot = 'test-results/windows'
          $overall = Get-Content "$evidenceRoot/installer-report.json" -Raw | ConvertFrom-Json
          if (-not $overall.passed) { throw 'Cannot assemble a release from failed installer/browser evidence.' }
          $measured = [System.Collections.Generic.List[string]]::new()
          $measured.Add('## Measured automated results for this build')
          $measured.Add('')
          [xml]$junit = Get-Content "$evidenceRoot/backend-junit.xml" -Raw
          $cases = $junit.SelectNodes('//testcase').Count
          $failures = $junit.SelectNodes('//failure').Count
          $skipped = $junit.SelectNodes('//skipped').Count
          if ($cases -eq 0 -or $failures -ne 0 -or $skipped -ne 0) { throw 'Backend evidence is missing, failed or skipped.' }
          $measured.Add(('Windows backend: **{0} tests, {1} failures, {2} skipped**.' -f $cases,$failures,$skipped))
          $nativeLog = Get-Content "$evidenceRoot/native-launcher.log" -Raw
          $nativeCounts = @{}
          foreach ($key in @('tests','pass','fail','skipped')) {
            $match = [regex]::Match($nativeLog,('(?m)^# '+$key+' (\d+)\s*$'))
            if (-not $match.Success) { throw ('Missing compiled-launcher evidence: '+$key) }
            $nativeCounts[$key] = [int]$match.Groups[1].Value
          }
          if ($nativeCounts.tests -eq 0 -or $nativeCounts.tests -ne $nativeCounts.pass -or $nativeCounts.fail -ne 0 -or $nativeCounts.skipped -ne 0) { throw 'Compiled-launcher evidence is incomplete, failed or skipped.' }
          $measured.Add(('Compiled-launcher suite: **{0}/{1} passed, {2} skipped**.' -f $nativeCounts.pass,$nativeCounts.tests,$nativeCounts.skipped))
          foreach ($recordName in @('exe-first-install','exe-upgrade-restart','exe-actual-default-profile','msi-first-install','msi-upgrade-restart','msi-actual-default-profile','exe-desktop-lifecycle','msi-desktop-lifecycle')) {
            $record = Get-Content "$evidenceRoot/$recordName.json" -Raw | ConvertFrom-Json
            $minimum = if ($recordName.EndsWith('desktop-lifecycle')) { 4 } else { 14 }
            if (-not $record.passed -or $record.checks.Count -lt $minimum -or ($record.checks | Where-Object passed -ne $true)) { throw "Incomplete installed evidence: $recordName" }
            $measured.Add(('- `{0}`: **{1}/{1} checks passed**.' -f $recordName,$record.checks.Count))
          }
          $measured.Add('')
          $measured.Add('Both formats installed, reinstalled and uninstalled. Actual default-profile record digests/counts and physical outputs retained; owned native registrations, prepared folders and shell shortcuts removed. See `installer-report.json` for actual counts.')
          $measured.Add('')
          $measured.Add('| Actual browser | Result | Qualification |')
          $measured.Add('| --- | --- | --- |')
          $matrix = @(Get-Content "$evidenceRoot/browser-matrix/matrix.json" -Raw | ConvertFrom-Json)
          if ($matrix.Count -ne 8 -or ($matrix | Where-Object status -eq 'failed')) { throw 'Incomplete or failed individual browser matrix.' }
          foreach ($row in $matrix) {
            $qualification = $row.reason
            if ($row.status -eq 'passed') {
              $record = Get-Content (Join-Path "$evidenceRoot/browser-matrix" $row.report) -Raw | ConvertFrom-Json
              if (-not $record.passed) { throw ('Browser report disagrees with matrix: '+$row.browser) }
              $qualification = 'Real native handshake, popup file SHA-256, content detection and managed media download. Developer/temporary installation only.'
            }
            $measured.Add(('| {0} | **{1}** | {2} |' -f $row.browser,$row.status,($qualification -replace '[|\r\n]',' ')))
          }
          $measured.Add('')
          foreach ($signature in $overall.signatures) { $measured.Add(('- Authenticode `{0}`: **{1}**.' -f $signature.file,$signature.status)) }
          $measured -join "`n" | Set-Content 'release-assets/MEASURED_RESULTS.md'
          Copy-Item 'dist/GetANNY Setup.exe' 'release-assets/GetANNY Setup.exe'
          Copy-Item 'dist/GetANNY Setup.msi' 'release-assets/GetANNY Setup.msi'
          Copy-Item 'docs/INSTALL_WINDOWS.md' 'release-assets/INSTALL_WINDOWS.md'
          Copy-Item 'docs/BROWSERS.md' 'release-assets/BROWSERS.md'
          Copy-Item 'docs/RELEASE_NOTES.md' 'release-assets/RELEASE_NOTES.md'
          Compress-Archive -Path test-results/windows/* -DestinationPath release-assets/Windows-test-evidence.zip
          node scripts/checksums.js
      - name: Retain tested distributables
        uses: actions/upload-artifact@v7
        with:
          name: GetANNY-tested-windows-release
          path: release-assets/
          retention-days: 30
      - name: Publish explicitly requested release candidate (not a claim of manual certification)
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists. Never silently replace an existing release." }
          $assets = Get-ChildItem release-assets -File | ForEach-Object { $_.FullName }
          $notesFile = Join-Path $env:RUNNER_TEMP 'GetANNY-release-notes.md'
          @(
            (Get-Content docs/RELEASE_NOTES.md -Raw),
            '',
            (Get-Content release-assets/MEASURED_RESULTS.md -Raw),
            '',
            '## Build and verification',
            'Source commit: `${{ github.sha }}`.',
            'Windows verification: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}',
            '',
            '## SHA-256',
            '```text',
            (Get-Content release-assets/SHA256SUMS.txt -Raw),
            '```'
          ) -join "`n" | Set-Content $notesFile
          gh release create $tag @assets --target '${{ github.sha }}' --prerelease --title "GetANNY $version · Windows release candidate" --notes-file $notesFile
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
