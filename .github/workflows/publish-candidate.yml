name: Publish requested Windows release candidate
on:
  push:
    branches: [arena/9c64a2a0-getanny]
    paths:
      - .github/workflows/publish-candidate.yml
      - scripts/publish-existing-candidate.js
      - tests/release-publication.test.js
permissions:
  contents: write
  actions: read
concurrency:
  group: getanny-publish-existing-candidate
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      contains(github.event.head_commit.message, 'GetANNY-Publish-Existing: 048d137')
    name: Publish immutable existing RC with explicit verification limits
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GETANNY_SOURCE_SHA: 048d13777331c20639e5330d70f42aca09d2f2d3
      GETANNY_SOURCE_RUN: "40986512553"
      GETANNY_ARTIFACT_ID: "12946814507"
      GETANNY_ARTIFACT_SHA256: 975b92cbf245366bca7a2242500c85d96c2b9d19fe5bff3bccb6964a8ec25417
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate publication-only guards (not app operation tests)
        run: node --test tests/release-publication.test.js
      - name: Verify immutable provenance, publish RC assets and verify uploaded digests
        run: node scripts/publish-existing-candidate.js
