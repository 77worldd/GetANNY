name: Publish requested Windows release candidate
on:
  push:
    branches: [arena/456bcab4-getanny]
    paths:
      - .github/workflows/publish-candidate.yml
      - scripts/publish-existing-candidate.js
      - tests/release-publication.test.js
permissions:
  contents: write
  actions: read
concurrency:
  group: getanny-publish-existing-candidate
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      contains(github.event.head_commit.message, 'GetANNY-Publish-Existing: 4a42bae')
    name: Publish immutable existing RC with explicit verification limits
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GETANNY_SOURCE_SHA: 4a42bae726221ff866d398f364efc11223e0bccc
      GETANNY_SOURCE_BRANCH: arena/456bcab4-getanny
      GETANNY_RELEASE_ID: "429118833"
      GETANNY_SOURCE_RUN: "41065654859"
      GETANNY_ARTIFACT_ID: "12982837394"
      GETANNY_ARTIFACT_SHA256: f0e74047867f77a22a604541fb030dcb8f2cb5ced9a989e97c2b77d5a6473e93
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate publication-only guards (not app operation tests)
        run: node --test tests/release-publication.test.js
      - name: Verify immutable provenance, publish RC assets and verify uploaded digests
        run: node scripts/publish-existing-candidate.js
